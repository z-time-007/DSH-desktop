# dsh-desktop bundle patch — one install for the whole desktop suite.
#
# This is the ONLY patch the loader applies for this bundle. Each inserted
# row's `name` resolves to the matching sub-package declared in the root
# package.json dependencies (plugins/…), so `dsh plugin add dsh-desktop`
# mounts the six features below in a single step.

- insert:
    - id: desktop-experience
      name: '@z-time-007/dsh-desktop-experience'
      config:
        enabled: true

    - id: local-desktop-app
      name: '@z-time-007/dsh-desktop-app'
      config:
        enabled: true
        pwa: true
        desktopTools: true

    - id: office-docs
      name: '@z-time-007/dsh-office-docs'
      config:
        enabled: true
        read: true
        write: true
        uploads: true
        maxUploadBytes: 26214400

    - id: token-pet
      name: '@z-time-007/dsh-token-pet'
      config:
        enabled: true
        balance: true
        usage: true

    - id: local-personal-assistant
      name: '@z-time-007/dsh-personal-assistant'
      config:
        enabled: true
        auditPath: '.assistant/audit/events.jsonl'
        computerStatus: true
        fileSteward: true
        secretary: true
        documentWriter: true
        fileStewardWriteApproval: true

    - id: safe-auto-approval
      name: '@z-time-007/dsh-safe-auto-approval'
      config:
        enabled: true
        auditPath: '.assistant/audit/auto-approvals.jsonl'
