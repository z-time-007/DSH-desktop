# Local development bundle for DeepSeek Harness 0.1.0-rc.6.
# This row is inert until the package is installed into a DSH profile or loaded
# from an explicitly reviewed development overlay.
#
# Note: use plain YAML (no `!!js` expressions) so the patch applies on any DSH
# patch loader, not just ones that evaluate embedded JS.

- insert:
    - id: local-personal-assistant
      name: '@z-time-007/dsh-personal-assistant'
      config:
        enabled: true
        auditPath: '.assistant/audit/events.jsonl'
        computerStatus: true
        fileSteward: true
        secretary: true
        documentWriter: true
        fileStewardWriteApproval: true
